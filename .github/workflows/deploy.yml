name: Deploy to edge-01

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      # Coolify builds the Dockerfile from main itself. The deploy API on edge-01 only accepts
      # GitHub Actions source ranges and a deploy-only token; no SSH access from CI anymore.
      - name: Trigger Coolify deploy
        env:
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_DEPLOY_TOKEN }}
          APP_UUID: o8g80o008scc48c884coo0kk
        run: |
          set -euo pipefail
          resp=$(curl -fsS -X POST -H "Authorization: Bearer ${COOLIFY_TOKEN}" \
            "https://edge-01.bombeck.io/api/v1/deploy?uuid=${APP_UUID}&force=false")
          echo "$resp" | jq -r '.deployments[] | "\(.message) (\(.deployment_uuid))"'

      - name: Wait for the site
        run: |
          sleep 90
          for i in $(seq 1 40); do
            code=$(curl -s -o /dev/null -w '%{http_code}' https://healthlog.dev/ || true)
            [ "$code" = 200 ] && { echo "healthlog.dev answers 200"; exit 0; }
            sleep 15
          done
          echo "healthlog.dev did not answer 200 after the deploy" >&2
          exit 1
